runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ./.node-version

    - name: Setup pnpm
      run: |
        npm i -g corepack@latest
        corepack enable
        corepack prepare pnpm@11.1.2 --activate
      shell: bash

    - name: Install dependencies
      run: pnpm i --frozen-lockfile
      shell: bash
